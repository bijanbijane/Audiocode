# Phase 6 Adaptive ASR Router Configuration v1.0
router:
  default_policy: balanced
  disagreement_only: false
  confidence_threshold: 0.82
  upper_95_conservative_cer: true

policies:
  quality_first:
    w_quality: 0.55
    w_latency: 0.15
    w_cost: 0.10
    w_reliability: 0.20
  balanced:
    w_quality: 0.40
    w_latency: 0.25
    w_cost: 0.20
    w_reliability: 0.15
  low_latency:
    w_quality: 0.20
    w_latency: 0.50
    w_cost: 0.15
    w_reliability: 0.15
  low_cost:
    w_quality: 0.20
    w_latency: 0.20
    w_cost: 0.45
    w_reliability: 0.15

circuit_breaker:
  failure_window_requests: 20
  open_error_rate_threshold: 0.25
  half_open_cooldown_ms: 30000
  alert_thresholds_pct: [50, 75, 90, 100]
