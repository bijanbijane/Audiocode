# deploy/docker-compose.backend.yml
# Canonical ADR-001 / ADR-002 Compose Configuration
# - Runs the canonical Express+Vite control/data plane (/server.ts) on port 3000 via deploy/Dockerfile.control-plane.
# - Keeps Local-First audio processing independent of PostgreSQL (optional cloud-plane profile).
# - Explicitly disables cloud ASR fallback by default (ENABLE_CLOUD_ASR=false).

services:
  avapardaz-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      ENABLE_CLOUD_ASR: "false"
      MODEL_STORAGE_DIR: "/var/lib/paudio/models"
      # Optional external control-plane database (not required for local-first audio editing)
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/asr/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    volumes:
      - model_chunks_storage:/var/lib/paudio/models:ro

  postgres:
    image: postgres:16-alpine
    profiles: ["optional-cloud-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: paudio_platform
      POSTGRES_USER: paudio_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required when optional-cloud-db profile is enabled}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../platform/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paudio_app -d paudio_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  model_chunks_storage:
