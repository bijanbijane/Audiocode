worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Guarantee correct MIME type for WebAssembly streaming compilation (instantiateStreaming)
    types {
        application/wasm wasm;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/wasm;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 1. Baseline Cross-Origin Isolation & Strict CSP ('wasm-unsafe-eval')
        include /etc/nginx/conf.d/security-headers.conf;

        # 2. Content-Addressable AI Model Chunks (8MB shards, immutable 1-yr cache, HTTP Range resume)
        location /models/ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Accept-Ranges "bytes" always;
            aio threads;
            directio 4m;
            output_buffers 2 1m;
        }

        # 3. Hashed JS/CSS/WASM bundle assets
        location /assets/ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # 4. Platform License & Signed Model Manifest API proxy (Node/Express backend)
        location /api/ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "no-store" always;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. SPA entrypoint: never cache index.html so atomic updates apply cleanly (Section 47)
        location / {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
