server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match the highest current server-side audio upload ceiling (100 MiB).
    # Express route-level validators still enforce their lower per-operation limits.
    client_max_body_size 100m;

    # Required by the browser audio/WASM runtime (SharedArrayBuffer and workers).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    # Normalize the prefix root so `/platform-api` and `/platform-api/` behave alike.
    location = /platform-api {
        return 308 /platform-api/;
    }

    # Fastify/PostgreSQL Platform API uses an isolated public prefix so no
    # existing Express route is silently shadowed during the migration.
    # The platform service must resolve as "avapardaz-platform-api" on this network.
    location ^~ /platform-api/ {
        proxy_pass http://avapardaz-platform-api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # The local-only Express service shares this Nginx container's network namespace
    # in deploy/docker-compose.separated.yml. Loopback preserves its anti-rebinding guard.
    # Preserve the original URI and stream request bodies instead of buffering audio uploads.
    location ^~ /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ^~ /v1 {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /index.html {
        # Nginx does not inherit server-level add_header directives once this
        # location declares its own add_header values; repeat isolation headers.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /ort/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
