openapi: 3.1.0
info:
  title: Avapardaz Speech Intelligence Platform API (Phase 11 Extension)
  version: 1.1.0-alpha
  description: >
    Modular Speech Intelligence capabilities layered over the immutable Phase 10 ASR core.
    Enforces strict tenant/project isolation, granular per-capability consent, and non-biometric policies.
servers:
  - url: http://localhost:3000
    description: Local G0_CPU_ONLY Sandbox
security:
  - BearerApiKey: []
paths:
  /v1/capabilities:
    get:
      summary: List registered speech intelligence capabilities and honest hardware availability
      responses:
        '200':
          description: Capability descriptor list
  /v1/capabilities/{capability_id}:
    get:
      summary: Get capability contract, dependencies, and pool limits
      responses:
        '200':
          description: Capability metadata
        '404':
          description: RESOURCE_NOT_FOUND
  /v1/capabilities/{capability_id}/versions:
    get:
      summary: List active capability contract versions
      responses:
        '200':
          description: Versions list
  /v1/intelligence/jobs:
    post:
      summary: Submit a DAG-orchestrated speech intelligence job with Idempotency-Key & consent checks
      responses:
        '201':
          description: IntelligenceJobRecord (COMPLETED or PARTIALLY_COMPLETED)
        '422':
          description: REGION_UNAVAILABLE
  /v1/intelligence/jobs/{job_id}:
    get:
      summary: Retrieve intelligence job status & per-capability breakdown
      responses:
        '200':
          description: IntelligenceJobRecord
        '403':
          description: TENANT_ISOLATION_DENIED
  /v1/intelligence/jobs/{job_id}/cancel:
    post:
      summary: Cancel running intelligence job
      responses:
        '200':
          description: Cancelled job record
  /v1/intelligence/jobs/{job_id}/artifacts:
    get:
      summary: Retrieve immutable versioned artifacts generated by a job
      responses:
        '200':
          description: SpeechArtifactRecord list
  /v1/recordings/{recording_id}/{artifact_slug}:
    get:
      summary: Retrieve latest & historical versions of diarization, alignment, translations, subtitles, meeting-intelligence, analytics, or search-index
      responses:
        '200':
          description: Versioned derived artifacts
  /v1/recordings/{recording_id}/search:
    post:
      summary: Tenant-isolated exact/phrase/semantic search scoped strictly prior to ranking
      responses:
        '200':
          description: Search hits with similarityScore (NOT factual confidence)
  /v1/recordings/{recording_id}:
    delete:
      summary: Cascade delete recording derived artifacts & semantic vectors
      responses:
        '200':
          description: Deletion count confirmation
  /v1/integrations:
    get:
      summary: List configured storage/messaging/SSO connectors and honest blocker status
      responses:
        '200':
          description: Connector list
    post:
      summary: Register enterprise connector interface
      responses:
        '201':
          description: Connector created
  /v1/integrations/{integration_id}:
    delete:
      summary: Remove enterprise connector
      responses:
        '200':
          description: Deleted confirmation
components:
  securitySchemes:
    BearerApiKey:
      type: http
      scheme: bearer
