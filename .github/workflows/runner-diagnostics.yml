name: Temporary GitHub Runner Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner allocation and toolchain smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report runner allocation
        run: |
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "GITHUB_ACTIONS=${GITHUB_ACTIONS}"
          uname -a
          id
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Verify toolchain
        run: |
          node --version
          npm --version
          bun --version
          git rev-parse --short HEAD
