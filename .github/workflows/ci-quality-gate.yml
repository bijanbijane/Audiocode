name: Architecture Governance, Reliability & Release Quality Gate

on:
  push:
    branches: [main, release/*, codex/avapardaz-audio-engines]
  pull_request:
    branches: [main, docs/r0-baseline-audit-2026-11-27]

permissions:
  contents: read

jobs:
  reliability-and-quality-gate:
    name: Typecheck, Reliability Fault-Injection, Quality Gates & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies from Frozen Bun Lockfile
        run: bun install --frozen-lockfile

      - name: Audit Rust Licenses & Supply Chain (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: wasm-audio-core/Cargo.toml

      - name: Verify Zero Circular TypeScript Dependencies
        run: npx madge --circular --extensions ts,tsx src/ packages/

      - name: Generate CycloneDX SBOM from Bun lockfile
        run: bunx --bun @cdxgen/cdxgen -t bun -o sbom-bun.cdx.json .

      - name: Verify TypeScript Compilation (Lint Gate)
        run: npm run lint

      - name: Run Vitest Integration & Quality Suites
        run: npx vitest run

      - name: Run Unit, Reliability & Fault-Injection Tests
        run: npx tsx --test src/engine/*.test.ts src/audio-engine/*.test.ts src/processing-core/*.test.ts src/project-core/*.test.ts src/runtime/*.test.ts src/security/*.test.ts src/quality-gate/*.test.ts

      - name: Run End-to-End Quality Gates
        run: npm run test:quality-gates

      - name: Build Production Bundle & Release Manifest
        run: npm run build

      - name: Verify Production Release Manifest & Runtime Assets
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/asr-stream-worklet.js
          test -f dist/release-manifest.json
          ls -la dist/ort/ort-wasm*.wasm

  native-binary-format-compatibility:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/r6-target-specific-release-packaging'
    name: Native Binary Format Verification — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies from Frozen Bun Lockfile
        run: bun install --frozen-lockfile

      - name: Record runner platform
        run: node -p "'runner=' + process.platform + '-' + process.arch"

      - name: Verify Mach-O and PE architecture parser fixtures
        run: bunx vitest run scripts/verify-native-binary.spec.ts

  native-runtime-provisioning:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/r6-target-specific-release-packaging'
    name: Native Sherpa Runtime Provisioning — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.12 for safe tar extraction
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies from Frozen Bun Lockfile
        run: bun install --frozen-lockfile

      - name: Provision, hash-verify, inspect and smoke-test native Sherpa runtime
        env:
          AVAPARDAZ_EXPECTED_TARGET: ${{ matrix.target }}
          AVAPARDAZ_RUNTIME_OUTPUT_DIR: ${{ runner.temp }}/avapardaz-native-runtime
        run: bunx tsx scripts/provision-release-native-runtime.ts

      - name: Upload verified target-native runtime payload
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/avapardaz-native-runtime/
          if-no-files-found: error
          retention-days: 1


  koochik-model-provenance:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/r6-target-specific-release-packaging'
    name: Koochik Model Provenance & Apache License Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies from Frozen Bun Lockfile
        run: bun install --frozen-lockfile

      - name: Restore pinned Koochik model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/avapardaz-koochik-model
          key: avapardaz-koochik-${{ hashFiles('src/asr-core/KoochikModelProvenance.mjs') }}

      - name: Provision pinned model, verify ONNX/tokens hashes and Apache license
        run: bunx tsx scripts/provision-release-koochik-model.ts --outdir=${{ runner.temp }}/avapardaz-koochik-model

      - name: Run model provenance/license regression tests
        run: bunx vitest run scripts/koochik-model-provenance.spec.ts

      - name: Upload verified Koochik model payload
        uses: actions/upload-artifact@v4
        with:
          name: koochik-model-pinned
          path: ${{ runner.temp }}/avapardaz-koochik-model/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1


  target-specific-release-package-build:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/r6-target-specific-release-packaging'
    name: Cross-target Internal Installer Package Build
    needs:
      - native-runtime-provisioning
      - koochik-model-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies from Frozen Bun Lockfile
        run: bun install --frozen-lockfile

      - name: Download verified macOS arm64 runtime
        uses: actions/download-artifact@v4
        with:
          name: sherpa-runtime-darwin-arm64
          path: ${{ runner.temp }}/native-runtime/darwin-arm64

      - name: Download verified macOS Intel runtime
        uses: actions/download-artifact@v4
        with:
          name: sherpa-runtime-darwin-x64
          path: ${{ runner.temp }}/native-runtime/darwin-x64

      - name: Download verified Windows x64 runtime
        uses: actions/download-artifact@v4
        with:
          name: sherpa-runtime-win32-x64
          path: ${{ runner.temp }}/native-runtime/win32-x64

      - name: Download pinned Apache Koochik model
        uses: actions/download-artifact@v4
        with:
          name: koochik-model-pinned
          path: ${{ runner.temp }}/koochik-model

      - name: Build production web application
        run: bun run build

      - name: Build unsigned target-specific installer and update packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/avapardaz-release-packages"
          build_target() {
            local target_id="$1"
            local target_platform="$2"
            local target_arch="$3"
            env \
              AVAPARDAZ_TARGET_PLATFORM="$target_platform" \
              AVAPARDAZ_TARGET_ARCH="$target_arch" \
              AVAPARDAZ_SHERPA_RUNTIME_TARGET="$target_id" \
              AVAPARDAZ_SHERPA_RUNTIME_DIR="${RUNNER_TEMP}/native-runtime/$target_id" \
              AVAPARDAZ_SHERPA_KOOCHIK_MODEL_DIR="${RUNNER_TEMP}/koochik-model" \
              node scripts/build-release-installer.mjs \
                --outdir="${RUNNER_TEMP}/avapardaz-release-packages/$target_id"
          }
          build_target darwin-arm64 darwin arm64
          build_target darwin-x64 darwin x64
          build_target win32-x64 win32 x64

      - name: Verify installer/update hashes, embedded manifests and target installers
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';
          import os from 'node:os';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const root = path.join(process.env.RUNNER_TEMP, 'avapardaz-release-packages');
          for (const target of ['darwin-arm64', 'darwin-x64', 'win32-x64']) {
            const manifestPath = path.join(root, target, 'release-artifacts-manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            for (const artifact of [manifest.installerTarball, manifest.updateTarball]) {
              const stat = fs.statSync(artifact.path);
              const hash = crypto.createHash('sha256').update(fs.readFileSync(artifact.path)).digest('hex');
              if (stat.size !== artifact.sizeBytes || hash !== artifact.sha256) {
                throw new Error('RELEASE_ARTIFACT_INTEGRITY_FAILED: ' + artifact.path);
              }
            }
            const product = manifest.packageManifest;
            const primaryModel = product?.components?.primaryPersianAsrModel;
            if (!product || !primaryModel) {
              throw new Error('RELEASE_PACKAGE_MANIFEST_SCHEMA_INVALID: ' + target);
            }
            if (primaryModel.revision !== '158e40e9ccf166c3655b7f4cd2abbfc7bbc87f7a'
              || primaryModel.licenseSpdx !== 'Apache-2.0'
              || product.target?.id !== target) {
              throw new Error('RELEASE_PACKAGE_PROVENANCE_MISMATCH: ' + target);
            }

            const extractRoot = fs.mkdtempSync(path.join(os.tmpdir(), 'avp-release-package-'));
            try {
              execFileSync('tar', ['-xzf', manifest.installerTarball.path, '-C', extractRoot], { stdio: 'pipe' });
              const packageRoot = path.join(extractRoot, 'avapardaz-v' + manifest.version + '-' + target);
              const installerDir = path.join(packageRoot, 'installer');
              const embeddedManifest = JSON.parse(fs.readFileSync(path.join(packageRoot, 'package-manifest.json'), 'utf8'));
              assert.deepStrictEqual(embeddedManifest, product, 'EMBEDDED_PACKAGE_MANIFEST_MISMATCH: ' + target);
              for (const script of ['install.mjs', 'uninstall.mjs', 'cpu-feature-preflight.mjs']) {
                const scriptPath = path.join(installerDir, script);
                if (!fs.existsSync(scriptPath)) throw new Error('INSTALLER_SCRIPT_MISSING: ' + target + '/' + script);
                execFileSync(process.execPath, ['--check', scriptPath], { stdio: 'pipe' });
              }
              if (target === 'win32-x64') {
                const wrapper = path.join(installerDir, 'install-windows.ps1');
                if (!fs.existsSync(wrapper) || !fs.readFileSync(wrapper, 'utf8').includes('install.mjs')) {
                  throw new Error('WINDOWS_INSTALLER_WRAPPER_INVALID');
                }
              } else {
                const wrapper = path.join(installerDir, 'install-macos.sh');
                if (!fs.existsSync(wrapper)) throw new Error('MACOS_INSTALLER_WRAPPER_MISSING');
                execFileSync('bash', ['-n', wrapper], { stdio: 'pipe' });
              }
              process.stdout.write(target + ': hashes, embedded manifest, installer syntax and provenance PASS\\n');
            } finally {
              fs.rmSync(extractRoot, { recursive: true, force: true });
            }
          }
          NODE

      - name: Upload target package manifests (unsigned artifacts remain in the runner workspace)
        uses: actions/upload-artifact@v4
        with:
          name: avapardaz-target-release-manifests
          path: ${{ runner.temp }}/avapardaz-release-packages/**/release-artifacts-manifest.json
          if-no-files-found: error
          retention-days: 3
