name: Import AVP Engine 02 and 03 handoff

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: HTTPS URL of the verified AVP-ENGINE02-03-FINAL-HANDOFF.zip
        required: true
        type: string
        default: https://ais-dev-nhhkzg4i2m4rr6nxxtuczt-806369253221.us-east1.run.app/AVP-ENGINE02-03-FINAL-HANDOFF.zip
      bundle_sha256:
        description: Expected SHA-256 of the complete ZIP
        required: true
        type: string
        default: ad5ead42d76f48a143e652fe17ddaedd3e69da3c3f03e6c6c8362297963eb88a

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: avp-engine02-engine03-handoff
  cancel-in-progress: false

jobs:
  import-handoff:
    name: Verify bundle, import 20 files, and open a draft PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Download and verify handoff archive
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          EXPECTED_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re, urllib.parse, urllib.request
          from pathlib import Path

          url = os.environ["BUNDLE_URL"].strip()
          expected = os.environ["EXPECTED_SHA256"].strip().lower()
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("BUNDLE_URL must be an HTTPS URL")
          if not re.fullmatch(r"[0-9a-f]{64}", expected):
              raise SystemExit("EXPECTED_SHA256 must be exactly 64 lowercase hexadecimal characters")

          target = Path(os.environ["RUNNER_TEMP"]) / "AVP-ENGINE02-03-FINAL-HANDOFF.zip"
          request = urllib.request.Request(url, headers={"User-Agent": "AVP-Handoff-Importer/1.0"})
          with urllib.request.urlopen(request, timeout=90) as response, target.open("wb") as out:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  out.write(chunk)

          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          print(f"Downloaded bytes: {target.stat().st_size}")
          print(f"Expected SHA-256: {expected}")
          print(f"Actual SHA-256:   {actual}")
          if actual != expected:
              raise SystemExit("BUNDLE_SHA256_MISMATCH: refusing to import")
          print(f"Verified archive: {target}")
          PY

      - name: Validate archive and import only the approved 20 source paths
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, re, zipfile
          from pathlib import Path

          archive = Path(__import__("os").environ["RUNNER_TEMP"]) / "AVP-ENGINE02-03-FINAL-HANDOFF.zip"
          expected = [
            "src/ai-engine/PersianTextNormalizer.ts",
            "src/ai-engine/PersianDisfluencyEngine.ts",
            "src/ai-engine/PersianSemanticRepetitionEngine.ts",
            "src/ai-engine/speech-events/SpeechEventContracts.ts",
            "src/ai-engine/speech-events/SpeechEventEngine.ts",
            "src/ai-engine/edit-decision/EditBoundaryRefiner.ts",
            "src/ai-engine/edit-decision/EditRiskEvaluator.ts",
            "src/ai-engine/edit-decision/EditCandidateEvaluator.ts",
            "src/ai-engine/edit-decision/ShahabToEngine02Adapter.ts",
            "src/ai-engine/edit-decision/index.ts",
            "src/ai-engine/edit-decision/Engine02SmartEditing.test.ts",
            "src/workflow/SmartAudioEditContracts.ts",
            "src/workflow/SmartAudioEditPipeline.ts",
            "src/workflow/SmartAudioEditJobManager.ts",
            "src/workflow/WavNativeDecoder.ts",
            "src/audio-renderer/RenderOutputArtifact.ts",
            "src/audio-renderer/AudioRenderPlanner.ts",
            "src/audio-renderer/AudioRenderEngine.ts",
            "src/audio-renderer/SmartEditPreviewRenderer.ts",
            "src/audio-renderer/Engine03AudioRenderer.test.ts",
          ]

          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP_CRC_FAILURE: {bad}")
              names = [n for n in zf.namelist() if not n.endswith("/")]
              for name in names:
                  p = Path(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"UNSAFE_ARCHIVE_PATH: {name}")
                  info = zf.getinfo(name)
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == 0o120000:
                      raise SystemExit(f"SYMLINK_NOT_ALLOWED: {name}")

              def find_one(suffix):
                  matches = [n for n in names if n == suffix or n.endswith("/" + suffix)]
                  if len(matches) != 1:
                      raise SystemExit(f"EXPECTED_ONE_ARCHIVE_ENTRY for {suffix}, found {len(matches)}")
                  return matches[0]

              sums_name = find_one("SHA256SUMS.txt")
              sums_text = zf.read(sums_name).decode("utf-8")
              checks = {}
              for line in sums_text.splitlines():
                  match = re.match(r"^([0-9a-fA-F]{64})\s+[* ]?(.+?)\s*$", line)
                  if match:
                      digest, listed = match.group(1).lower(), match.group(2).replace("\\", "/")
                      checks[listed] = digest

              imported = []
              for rel in expected:
                  member = find_one(rel)
                  data = zf.read(member)
                  digest = hashlib.sha256(data).hexdigest()
                  sum_matches = [v for k, v in checks.items()
                                 if k == rel or k.endswith("/" + rel) or k.endswith("/files/" + rel)]
                  if len(sum_matches) != 1:
                      raise SystemExit(f"SHA256SUMS_ENTRY_NOT_UNIQUE: {rel} ({len(sum_matches)})")
                  if digest != sum_matches[0]:
                      raise SystemExit(f"SOURCE_HASH_MISMATCH: {rel}")
                  destination = Path(rel)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  imported.append((rel, len(data), digest))

              if len(imported) != 20 or len({x[0] for x in imported}) != 20:
                  raise SystemExit("EXPECTED_EXACTLY_20_UNIQUE_SOURCE_FILES")

          print(f"Imported and verified {len(imported)} source files:")
          for rel, size, digest in imported:
              print(f"{digest}  {size:>8}  {rel}")
          PY

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run Engine 02, Engine 03, TypeScript, and production build checks
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bun run tsx --test \
            src/ai-engine/edit-decision/Engine02SmartEditing.test.ts \
            src/ai-engine/edit-decision/EditDecisionEngine.test.ts \
            src/ai-engine/PersianDisfluencyEngine.test.ts \
            src/ai-engine/PersianSemanticRepetitionEngine.test.ts \
            src/audio-renderer/AudioRenderEngine.test.ts \
            src/workflow/CanonicalProjectWorkflowAndDsp.test.ts
          e02=$?

          bun run tsx --test \
            src/audio-renderer/Engine03AudioRenderer.test.ts \
            src/audio-renderer/AudioRenderEngine.test.ts \
            src/audio-renderer/RenderOutputArtifact.test.ts \
            src/audio-renderer/StreamingArtifactValidator.test.ts \
            src/workflow/CanonicalProjectWorkflowAndDsp.test.ts \
            src/workflow/StudioWorkflowController.pass4.test.ts
          e03=$?

          bun run lint
          lint=$?

          bun run build
          build=$?

          {
            echo "engine02_exit_code=$e02"
            echo "engine03_exit_code=$e03"
            echo "typecheck_exit_code=$lint"
            echo "build_exit_code=$build"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## AVP Engine 02 + 03 handoff checks"
            echo "- Engine 02 test exit code: $e02"
            echo "- Engine 03 test exit code: $e03"
            echo "- TypeScript exit code: $lint"
            echo "- Production build exit code: $build"
            echo "- Note: the SHAHAB real-model vertical-slice test may be environment-blocked when pinned ONNX assets and sample.wav are unavailable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create isolated branch and commit the verified source files
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="codex/avp-engine02-03-handoff-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          git add -- \
            src/ai-engine/PersianTextNormalizer.ts \
            src/ai-engine/PersianDisfluencyEngine.ts \
            src/ai-engine/PersianSemanticRepetitionEngine.ts \
            src/ai-engine/speech-events/SpeechEventContracts.ts \
            src/ai-engine/speech-events/SpeechEventEngine.ts \
            src/ai-engine/edit-decision/EditBoundaryRefiner.ts \
            src/ai-engine/edit-decision/EditRiskEvaluator.ts \
            src/ai-engine/edit-decision/EditCandidateEvaluator.ts \
            src/ai-engine/edit-decision/ShahabToEngine02Adapter.ts \
            src/ai-engine/edit-decision/index.ts \
            src/ai-engine/edit-decision/Engine02SmartEditing.test.ts \
            src/workflow/SmartAudioEditContracts.ts \
            src/workflow/SmartAudioEditPipeline.ts \
            src/workflow/SmartAudioEditJobManager.ts \
            src/workflow/WavNativeDecoder.ts \
            src/audio-renderer/RenderOutputArtifact.ts \
            src/audio-renderer/AudioRenderPlanner.ts \
            src/audio-renderer/AudioRenderEngine.ts \
            src/audio-renderer/SmartEditPreviewRenderer.ts \
            src/audio-renderer/Engine03AudioRenderer.test.ts

          if git diff --cached --quiet; then
            echo "No source changes detected; refusing to create an empty PR."
            exit 1
          fi

          git commit -m "feat(audio): import verified Engine 02 and Engine 03 handoff"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          E02: ${{ steps.checks.outputs.engine02_exit_code }}
          E03: ${{ steps.checks.outputs.engine03_exit_code }}
          TSC: ${{ steps.checks.outputs.typecheck_exit_code }}
          BUILD: ${{ steps.checks.outputs.build_exit_code }}
          EXPECTED_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          BODY="$(cat <<EOF
          ## Summary
          Imports the pinned AVP Engine 02 + Engine 03 handoff archive into an isolated branch.

          - Source scope: exactly 20 allowlisted files.
          - Archive SHA-256: ${EXPECTED_SHA256}
          - Engine 02 test exit code: ${E02}
          - Engine 03 test exit code: ${E03}
          - TypeScript exit code: ${TSC}
          - Production build exit code: ${BUILD}

          ## Review requirements
          - Review the complete diff before merge.
          - Confirm the shared workflow files preserve both Engine 02 and Engine 03 changes.
          - The real SHAHAB vertical-slice test requires the pinned model assets and sample.wav; an unavailable fixture must remain explicitly blocked, not mocked or skipped.
          - This PR does not claim independent release approval.
          EOF
          )"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${BRANCH}" \
            --draft \
            --title "feat(audio): import verified Engine 02 and Engine 03 handoff" \
            --body "$BODY"
