name: AVAPARDAZ Quality & Release Gates (AVP-P0-005 / AVP-P0-006 / AVP-P0-007)

on:
  push:
    branches: [main, master, codex/avapardaz-audio-engines]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level1-static-and-build:
    name: Level 1 — Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies from frozen bun.lock
        run: bun install --frozen-lockfile
      - name: Run focused VAD & speaker embedding regression suites
        run: |
          bun run tsx --test \
            src/ai-engine/asr/SileroVadOnnxRunner.test.ts \
            src/ai-engine/asr/SpeakerEmbeddingOnnxRunner.test.ts \
            src/ai-engine/asr/WespeakerKaldiFbank80.test.ts \
            src/ai-engine/asr/LocalWeSpeakerDiarizationService.test.ts \
            src/ai-engine/MultiSpeakerDiarizationAndCrosstalkEngine.test.ts
      - name: Build production web bundle
        if: always()
        run: npm run build
      - name: Verify self-hosted ORT WASM assets exist
        if: always()
        run: |
          # Vite serves development assets directly from node_modules and copies
          # the packaged runtime into dist/ort during production builds.
          test -f dist/ort/ort-wasm-simd-threaded.wasm
      - name: Run linter
        if: always()
        run: npm run lint

  level2-unit-dsp-linguistic-security-real-ort:
    name: Level 2–4 — Real ORT Offline, DSP, Workflow, Linguistic, IPC & Security Suites
    runs-on: ubuntu-latest
    needs: level1-static-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies from frozen bun.lock
        run: bun install --frozen-lockfile
      - name: Download and verify pinned Persian Zipformer assets
        run: node scripts/download-persian-zipformer-assets.mjs
      - name: Download and verify pinned Silero VAD v5 asset
        run: node scripts/download-persian-zipformer-assets.mjs models/silero-vad/1.0.0/manifest.json
      - name: Download and verify pinned WeSpeaker ECAPA ONNX asset
        run: node scripts/download-persian-zipformer-assets.mjs models/speaker-embedding/1.0.0/manifest.json
      - name: Run real WeSpeaker ECAPA ONNX/WASM CPU inference
        run: npx --yes tsx --test src/ai-engine/asr/SpeakerEmbeddingOnnxRunner.real-model.test.ts
      - name: Run integrated local Silero VAD + WeSpeaker diarization smoke
        run: npx --yes tsx --test src/ai-engine/asr/LocalWeSpeakerDiarizationService.real-model.test.ts
      - name: Run real Silero VAD v5 ONNX/WASM CPU inference
        run: npx --yes tsx --test src/ai-engine/asr/SileroVadOnnxRunner.real-model.test.ts
      - name: Run real SHAHAB Zipformer ONNX inference and parity suite
        run: npx --yes tsx --test src/shahab/ShahabProgram.test.ts
      - name: Run canonical P0 automated verification suites (30 tests)
        run: |
          npx --yes tsx --test \
            src/lifecycle/ModelProvenanceAndDelivery.test.ts \
            src/asr-core/RealOnnxAndCrossRuntimeConformance.test.ts \
            src/workflow/CanonicalProjectWorkflowAndDsp.test.ts \
            src/asr-core/PersianLinguisticCorrectionAndLexical.test.ts \
            src/host-bridge/companion/__tests__/CompanionProductionIpcAndCep.test.ts \
            src/security/ArchitectureAndSecurityGuardrails.test.ts \
            src/host-bridge/companion/__tests__/LocalCompanionAndSecurity.test.ts \
            src/studio-workflow/__tests__/StudioWorkflowController.pass4.test.ts
      - name: Verify no bundled model weights or secrets in web bundle
        run: |
          test -z "$(find src public dist -type f \( -name '*.onnx' -o -name '*.bin' -o -name '*.pt' \))"

  level5-cep-packaging-and-audit:
    name: Level 5 — Audition CEP Packaging & Supply-Chain Audit
    runs-on: ubuntu-latest
    needs: level2-unit-dsp-linguistic-security-real-ort
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Adobe Audition CEP manifest & CSP hygiene
        run: |
          test -f packages/audition-cep-plugin/CSXS/manifest.xml
          grep -q "AUDT" packages/audition-cep-plugin/CSXS/manifest.xml
          grep -q "Content-Security-Policy" packages/audition-cep-plugin/client/index.html
      - name: Check lockfile / dependency audit availability
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "::warning::Repository uses bun.lock; npm audit cannot audit this lockfile. Add a Bun-lockfile-compatible advisory scan before release."
          fi
